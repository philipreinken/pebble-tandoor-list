on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**/*"
      - "package-lock.json"
  pull_request:
    branches:
      - main
    paths:
      - "src/**/*"
      - "package-lock.json"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "v0.21.4"
          verb: call
          args: >-
            --source="."
            build
            export --path="build/tandoor-list.pbw"
      - id: deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/tandoor-list.pbw
