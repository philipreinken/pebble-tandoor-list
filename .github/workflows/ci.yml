on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/*"
      - ".dagger/*"
      - "src/*"
      - "package-lock.json"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/*"
      - ".dagger/*"
      - "src/**/*"
      - "package-lock.json"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-docker-action@v5
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/checkout@v5
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "v0.21.4"
          verb: call
          args: >-
            --source="."
            build
            file --path="build/app.pbw"
            export --path="build/app.pbw"
      - uses: actions/upload-artifact@v7
        with:
          path: "build/app.pbw"
          archive: false
